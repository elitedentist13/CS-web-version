<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana X-ray Helper — manual</title>
<style>
@page { size: A4; margin: 14mm 14mm 16mm; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
    margin: 0; background: #f1f5f9; color: #1e293b;
    font-family: "Segoe UI", system-ui, "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
    font-size: 11pt; line-height: 1.55;
}
[lang="zh-Hant"] { font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; }
[lang="zh-CN"] { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
#manual { max-width: 820px; margin: 0 auto; padding: 20px 0; }
.xhg-page { background: #fff; padding: 22px 26px; margin: 0 0 20px; border-radius: 10px; box-shadow: 0 4px 16px rgba(15, 23, 42, .08); }
@media print {
    body { background: #fff; }
    #manual { max-width: none; padding: 0; }
    .xhg-page { box-shadow: none; border-radius: 0; padding: 0; margin: 0; break-before: page; }
    .xhg-page:first-child { break-before: auto; }
    .xhg-step, .xhg-tips, .xhg-picker, .xhg-before, .xhg-intro, .xhg-bar { break-inside: avoid; }
}

/* Cover */
.xhg-cover { text-align: center; padding-top: 40px; }
.xhg-cover-logo { font-size: 64pt; line-height: 1; }
.xhg-cover h1 { font-size: 26pt; margin: 10px 0 4px; color: #422006; }
.xhg-cover h1 span { display: block; font-size: 15pt; color: #92400e; font-family: "Microsoft JhengHei", sans-serif; margin-top: 4px; }
.xhg-cover-sub { color: #64748b; margin: 6px 0 26px; }
.xhg-cover-toc { list-style: none; padding: 0; margin: 0 auto 28px; max-width: 460px; text-align: left; }
.xhg-cover-toc li { margin: 8px 0; padding: 10px 14px; border: 1px solid #fde68a; background: #fffbeb; border-radius: 10px; }
.xhg-cover-toc a { color: #1e293b; text-decoration: none; }
.xhg-cover-key {
    max-width: 560px; margin: 0 auto; text-align: left;
    background: #fff7ed; border: 2px solid #fb923c; border-radius: 12px; padding: 12px 16px;
}
.xhg-cover-key b { color: #9a3412; }
.xhg-cover-key p { margin: 6px 0 0; }

/* Language section */
.xhg-head {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 12px; border-radius: 10px;
    background: linear-gradient(180deg, #fef08a 0%, #fde047 60%, #facc15 100%); border: 1px solid #eab308;
}
.xhg-title { margin: 0; font-size: 16pt; color: #422006; flex: 1 1 auto; }
.xhg-lang-tag { background: #1e293b; color: #fde047; font-weight: 700; font-size: 10pt; padding: 3px 12px; border-radius: 999px; }
.xhg-body h3 { margin: 0 0 6px; font-size: 13pt; color: #0f172a; display: flex; align-items: center; gap: 8px; }
.xhg-body ul { margin: 4px 0 8px; padding-left: 22px; }
.xhg-body li { margin: 3px 0; }
.xhg-body p { margin: 4px 0 8px; }
.xhg-intro { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 14px; }
.xhg-before, .xhg-step, .xhg-tips { margin: 12px 0; }
.xhg-num {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
    background: #1e293b; color: #fde047; font-size: 11pt; font-weight: 800; flex: 0 0 auto;
}
.xhg-step.is-key { background: #fff7ed; border: 2px solid #fb923c; border-radius: 12px; padding: 10px 14px; }
.xhg-share { display: grid; grid-template-columns: 1fr 270px; gap: 14px; align-items: start; }
.xhg-note { font-size: 10pt; color: #475569; }
.xhg-quality { font-size: 9.5pt; color: #64748b; border-top: 1px dashed #e2e8f0; padding-top: 8px; }
.xhg-tips dl { margin: 4px 0 0; display: grid; grid-template-columns: 34% 1fr; gap: 5px 14px; }
.xhg-tips dt { font-weight: 700; color: #9a3412; }
.xhg-tips dd { margin: 0; }

/* Mock of Chrome's "Choose what to share" box */
.xhg-picker { border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; overflow: hidden; box-shadow: 0 6px 16px rgba(15, 23, 42, .15); font-size: 9pt; line-height: 1.35; }
.xhg-picker-head { padding: 7px 10px; font-weight: 700; background: #f1f5f9; }
.xhg-picker-tabs { display: flex; border-bottom: 1px solid #e2e8f0; }
.xhg-tab { flex: 1; text-align: center; padding: 6px 3px; font-weight: 700; color: #64748b; }
.xhg-tab.is-bad { color: #b91c1c; text-decoration: line-through; background: #fef2f2; }
.xhg-tab.is-good { color: #166534; background: #dcfce7; box-shadow: inset 0 -3px 0 #16a34a; }
.xhg-tab.is-ok { color: #166534; }
.xhg-picker-body { display: grid; gap: 5px; padding: 7px; }
.xhg-win { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border: 1px solid #e2e8f0; border-radius: 7px; color: #334155; }
.xhg-win span { font-size: 12pt; }
.xhg-win b { margin-left: auto; }
.xhg-win.is-good { border: 2px solid #16a34a; background: #f0fdf4; color: #14532d; font-weight: 700; }
.xhg-win.is-good b { color: #16a34a; }
.xhg-win.is-bad { background: #fef2f2; color: #991b1b; }
.xhg-win.is-bad b { color: #dc2626; }
.xhg-picker-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 7px; border-top: 1px solid #e2e8f0; }
.xhg-fake-btn { border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 10px; color: #475569; }
.xhg-fake-btn.is-primary { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 700; }

/* Mock of the yellow bar */
.xhg-bar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; padding: 6px 10px;
    border-radius: 8px; font-size: 9pt; color: #422006;
    background: linear-gradient(180deg, #fef08a 0%, #fde047 55%, #facc15 100%); border: 1px solid #eab308;
}
.xhg-pill { background: #fffbeb; border: 1px solid #f59e0b; border-radius: 999px; padding: 1px 8px; }
.xhg-bbtn { background: #fff; border: 1px solid #eab308; border-radius: 6px; padding: 2px 7px; font-weight: 700; }
.xhg-bbtn.is-dark { background: #1e293b; color: #fde047; border-color: #0f172a; }
.xhg-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
.xhg-bar-status { color: #713f12; flex: 1 1 auto; }
</style>
</head>
<body>
<main id="manual"></main>
<script src="xray-helper-manual.js"></script>
</body>
</html>
